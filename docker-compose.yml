services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glot
      POSTGRES_PASSWORD: glot
      POSTGRES_DB: glot
    ports:
      - '${GLOT_POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glot -d glot']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
