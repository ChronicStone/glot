services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glot}
      POSTGRES_DB: glot
    ports:
      - '127.0.0.1:${GLOT_POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glot -d glot']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GLOT_MAILPIT_PORT:-8025}:8025'
      - '127.0.0.1:${GLOT_SMTP_PORT:-1025}:1025'

  glot:
    profiles: ['app']
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://glot:${POSTGRES_PASSWORD:-glot}@postgres:5432/glot
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET to at least 32 random characters}
      APP_URL: ${APP_URL:-http://localhost:3100}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GLOT_GIT_ROOT: ${GLOT_GIT_ROOT:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GLOT_CLOCK: ${GLOT_CLOCK:-on}
    volumes:
      - ${GLOT_REPOSITORIES:-./repositories}:/repositories
    ports:
      - '${GLOT_PORT:-3100}:3000'

volumes:
  postgres-data:
